<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Tracker — Share My Location</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="track-app">

    <div id="track-logo">📡</div>
    <h1 id="track-title">Share My Location</h1>
    <p id="track-subtitle">Your location will be sent to the tracker dashboard in real time.</p>

    <div id="track-status-row">
      <div id="track-dot"></div>
      <span id="track-status">Tap Start to begin</span>
    </div>

    <div id="track-stats">
      <div class="tstat"><span class="tl">Coordinates</span><span class="tv" id="t-coords">—</span></div>
      <div class="tstat"><span class="tl">Accuracy</span><span class="tv" id="t-accuracy">—</span></div>
      <div class="tstat"><span class="tl">Battery</span><span class="tv" id="t-battery">—</span></div>
      <div class="tstat"><span class="tl">Pings sent</span><span class="tv" id="t-pings">0</span></div>
    </div>

    <div id="track-name-row">
      <label for="t-name-input">Your device name</label>
      <input id="t-name-input" type="text" placeholder="e.g. John's iPhone" maxlength="30" />
    </div>

    <button id="btn-track-start">▶ Start Sharing</button>

  </div>

  <script src="track.js"></script>
</body>
</html>
